name: Fix English Banner Top Strip

on:
  push:
    paths:
      - '.github/workflows/fix-english-banner-top.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Remove dark top strip from English banner
        run: |
          python - <<'PY'
          from PIL import Image
          import urllib.request
          import os

          url = 'https://raw.githubusercontent.com/singh1960/shiksha-bachao-association/main/banner-english.png'
          path = 'banner-english.png'
          tmp = '/tmp/banner-english.png'
          urllib.request.urlretrieve(url, tmp)
          im = Image.open(tmp).convert('RGB')
          w, h = im.size

          # Detect a solid/dominant dark-blue strip only at the very top.
          limit = min(h // 4, 220)
          cut = 0
          for y in range(limit):
              row = [im.getpixel((x, y)) for x in range(0, w, max(1, w // 400))]
              dark_blue = sum(1 for r,g,b in row if r < 45 and g < 80 and b < 125)
              if dark_blue / len(row) >= 0.72:
                  cut = y + 1
              else:
                  if cut >= 12:
                      break
                  cut = 0

          if cut < 12:
              raise SystemExit(f'No reliable top strip detected (cut={cut}); no image change made.')

          cropped = im.crop((0, cut, w, h))
          # Keep the existing canvas dimensions so the website layout remains unchanged.
          cropped = cropped.resize((w, h), Image.Resampling.LANCZOS)
          cropped.save(path, format='PNG', optimize=True)
          print(f'Removed {cut}px top strip from {w}x{h} banner and restored canvas size.')
          PY

      - name: Commit corrected banner and remove this one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add banner-english.png
          git rm .github/workflows/fix-english-banner-top.yml
          git diff --cached --quiet && { echo 'No changes to commit.'; exit 0; }
          git commit -m 'Fix English homepage banner top strip'
          git push