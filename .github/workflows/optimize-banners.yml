name: Optimize Banner Images

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize-banners:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Optimize banner PNGs
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for name in ['banner-hindi.png', 'banner-marathi.png', 'banner-english.png']:
              p = Path(name)
              im = Image.open(p)
              if im.mode not in ('RGB', 'RGBA'):
                  im = im.convert('RGBA')
              # Keep the existing dimensions; optimize PNG encoding only.
              im.save(p, format='PNG', optimize=True, compress_level=9)
              print(name, p.stat().st_size)
          PY

      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add banner-hindi.png banner-marathi.png banner-english.png
          if git diff --cached --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "Optimize banner images"
            git push
          fi
