name: Fix Banner Full Width

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-banner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Remove side gaps from homepage banners
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'width:min(925px,100%)!important;max-width:925px!important;'
          new = 'width:100%!important;max-width:100%!important;'
          if old not in s:
              raise SystemExit('Expected banner CSS not found; stopping without changes.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit correction and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add index.html
          git commit -m 'Make homepage banners full width'
          git push
          rm -f .github/workflows/fix-banner-full-width.yml
          git add -u .github/workflows/fix-banner-full-width.yml
          git commit -m 'Remove one-time banner width workflow'
          git push
