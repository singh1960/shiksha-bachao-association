name: Fix Banner Display Size

on:
  push:
    paths:
      - '.github/workflows/fix-banner-size.yml'

permissions:
  contents: write

jobs:
  fix-banner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply banner size correction
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '''.homepage-image-banner img.language-banner{height:330px!important;width:auto!important;max-width:100%!important;object-fit:contain!important;object-position:center center!important;filter:none;}'''
          new = '''.homepage-image-banner img.language-banner{height:330px!important;width:min(925px,100%)!important;max-width:925px!important;object-fit:fill!important;object-position:center center!important;filter:none;}'''

          if old not in s:
              raise SystemExit('Expected banner CSS was not found; no change made.')

          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit correction and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-banner-size.yml
          git commit -m "Fix equal homepage banner display size"
          git rm .github/workflows/fix-banner-size.yml
          git commit -m "Remove one-time banner fix workflow"
          git push
