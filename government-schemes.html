<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>सरकारी योजनाएँ | शिक्षा बचाओ संगठन</title>
<style>
:root{--primary:#124e78;--secondary:#f2a900;--light:#f5f8fb;--dark:#17324d;--border:#d9e2ec}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans Devanagari",sans-serif;background:var(--light);color:#23313f;line-height:1.65}
header{background:linear-gradient(135deg,var(--primary),#1d789b);color:#fff;text-align:center;padding:28px 15px}
header h1{margin:0 0 6px;font-size:clamp(24px,5vw,38px)}
header p{margin:0;font-size:16px}
nav{background:#fff;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:12px;border-bottom:1px solid var(--border)}
nav a{color:var(--primary);text-decoration:none;font-weight:bold;padding:7px 12px;border-radius:6px}
nav a:hover{background:#eaf3f8}
.language-bar{text-align:center;padding:18px 10px}
.lang-btn{border:1px solid var(--primary);background:#fff;color:var(--primary);padding:9px 16px;margin:4px;border-radius:22px;cursor:pointer;font-weight:bold}
.lang-btn.active,.lang-btn:hover{background:var(--primary);color:#fff}
.container{max-width:1100px;margin:auto;padding:10px 16px 35px}
.notice{background:#fff7df;border-left:5px solid var(--secondary);padding:15px 18px;border-radius:8px;margin:10px 0 25px}
.section-title{color:var(--primary);margin-top:28px;border-bottom:2px solid var(--secondary);padding-bottom:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;box-shadow:0 3px 10px #17324d12}
.card h3{color:var(--primary);margin-top:0}
.card p{margin-bottom:12px}
.card a{display:inline-block;background:var(--primary);color:#fff;text-decoration:none;padding:8px 13px;border-radius:6px}
.card a:hover{background:#0b3857}
.small{font-size:14px;color:#526575}
footer{background:var(--dark);color:#fff;text-align:center;padding:22px 15px}
footer p{margin:4px}
.hidden{display:none}
@media(max-width:600px){.card{padding:16px}nav a{font-size:14px}}

/* SBA Professional Page Enhancement */
header{box-shadow:0 4px 18px rgba(18,60,105,.16);position:relative;}
header h1,.hero h1,.hero h2{font-weight:800;text-shadow:0 2px 7px rgba(0,0,0,.22);}
.card,.box,.option,.item{transition:transform .2s ease,box-shadow .2s ease;}
.card:hover,.box:hover,.option:hover,.item:hover{transform:translateY(-3px);box-shadow:0 9px 24px rgba(18,60,105,.12);}
.hero{border-bottom:5px solid #e2a900;}
@media(max-width:600px){header h1,.hero h1,.hero h2{font-size:30px;line-height:1.25;}}
/* Government Schemes Hero - clean language banner */
.gov-hero{position:relative;max-width:1200px;margin:0 auto 12px;min-height:300px;background-size:cover;background-position:center;display:flex;align-items:center;overflow:hidden;box-shadow:0 8px 24px rgba(18,60,105,.18);border-bottom:5px solid #e2a900}
.gov-hero-inner{position:absolute;inset:0;display:flex;align-items:flex-end;padding:25px 30px;background:linear-gradient(0deg,rgba(0,0,0,.28),transparent 45%);color:#fff}
.gov-hero h2{display:none}.gov-hero p{display:none}.gov-credit{display:none}
@media(max-width:600px){.gov-hero{min-height:220px}.gov-hero-inner{padding:18px}}
</style>
</head>

<nav>
  <a href="index.html" id="homeLink">मुख्य पृष्ठ</a>

<div class="language-bar" aria-label="भाषा चुनें">
  <button class="lang-btn active" data-lang="hi">हिंदी</button>
  <button class="lang-btn" data-lang="en">English</button>
  <button class="lang-btn" data-lang="mr">मराठी</button>
</div>

<main class="container">
  <div class="notice" id="notice"></div>
  <div id="content"></div>
</main>

<footer>

function renderSchemes(lang){
 const d=data[lang]||data.hi;
 const hero=document.getElementById("govHero");
 if(hero) hero.style.backgroundImage="url('"+d.hero+"')";
 document.getElementById("homeLink").textContent=d.home;
 document.getElementById("aboutLink").textContent=d.about;
 document.getElementById("welfareLink").textContent=d.welfare;
 document.getElementById("downloadsLink").textContent=d.downloads;
 document.getElementById("notice").textContent=d.notice;
 document.getElementById("footerText").textContent=d.footer;
 document.getElementById("footerNote").textContent=d.note;
 document.getElementById("content").innerHTML="<h2 class='section-title'>"+d.heading+"</h2><div class='cards'>"+d.cards.map(function(c){return "<article class='card'><h3>"+c[0]+"</h3><p>"+c[1]+"</p><a href='"+c[2]+"' target='_blank' rel='noopener noreferrer'>"+c[3]+"</a></article>"}).join("")+"</div>";
 document.querySelectorAll(".lang-btn").forEach(function(b){b.classList.toggle("active",b.getAttribute("data-lang")===lang)});
}
document.addEventListener("DOMContentLoaded",function(){
 document.querySelectorAll(".lang-btn").forEach(function(b){b.addEventListener("click",function(){renderSchemes(b.getAttribute("data-lang"))})});
 const q=new URLSearchParams(window.location.search).get("lang");
 renderSchemes(["hi","en","mr"].includes(q)?q:"hi");
});
