const data={hi:{title:'📜 शिक्षा से जुड़े सरकारी आदेश एवं शासन निर्णय (GR)',subtitle:'शिक्षा बचाओ संगठन — शिक्षकों, कर्मचारियों और विद्यालयों से संबंधित सरकारी आदेश',home:'मुख्य पृष्ठ',schemes:'सरकारी योजनाएँ',welfare:'कल्याण योजना',downloads:'डाउनलोड / फॉर्म',about:'हमारे बारे में',notice:'विषयवार सत्यापित लिंक शीघ्र जोड़े जाएँगे। नीचे शिक्षा विभाग के आधिकारिक स्रोत दिए गए हैं।',heading:'विषयवार उपखंड',foot:'© 2026 शिक्षा बचाओ संगठन',soon:'जानकारी शीघ्र उपलब्ध कराई जाएगी',official:'आधिकारिक स्रोत',links:[['शालेय शिक्षण व क्रीडा विभाग','महाराष्ट्र के शालेय शिक्षण विभाग की आधिकारिक वेबसाइट','https://education.maharashtra.gov.in/','शिक्षा विभाग की वेबसाइट खोलें'],['MSCERT महाराष्ट्र — शासन निर्णय','राज्य शैक्षणिक संशोधन व प्रशिक्षण परिषद के शासन निर्णय','https://maa.ac.in/english/index.php?tcf=shasan_nirnay','MSCERT शासन निर्णय खोलें'],['महाराष्ट्र शासन का GR पोर्टल','विभागवार शासन निर्णय खोजने के लिए आधिकारिक पोर्टल','https://gr.maharashtra.gov.in/1145/Government-Resolutions','आधिकारिक GR पोर्टल खोलें']]},en:{title:'📜 Education-Related Government Orders & Government Resolutions (GR)',subtitle:'Shiksha Bachao Association — Government orders concerning teachers and schools',home:'Home',schemes:'Government Schemes',welfare:'Welfare Scheme',downloads:'Downloads / Forms',about:'About Us',notice:'Verified subject-wise links will be added soon. Official education sources are provided below.',heading:'Subject-wise Sections',foot:'© 2026 Shiksha Bachao Association',soon:'Information will be added soon',official:'Official Sources',links:[['School Education and Sports Department','Official website of Maharashtra School Education Department','https://education.maharashtra.gov.in/','Open Education Department Website'],['MSCERT Maharashtra — Government Resolutions','Government resolutions of MSCERT Maharashtra','https://maa.ac.in/english/index.php?tcf=shasan_nirnay','Open MSCERT Resolutions'],['Maharashtra Government GR Portal','Official portal for department-wise Government Resolutions','https://gr.maharashtra.gov.in/1145/Government-Resolutions','Open Official GR Portal']]},mr:{title:'📜 शिक्षणाशी संबंधित शासकीय आदेश व शासन निर्णय (GR)',subtitle:'शिक्षा बचाओ संगठन — शिक्षक व शाळांशी संबंधित शासकीय आदेश',home:'मुख्य पृष्ठ',schemes:'शासकीय योजना',welfare:'कल्याण योजना',downloads:'डाउनलोड / फॉर्म',about:'आमच्याविषयी',notice:'विषयानुसार सत्यापित दुवे लवकरच जोडले जातील. खाली अधिकृत शैक्षणिक स्रोत दिले आहेत.',heading:'विषयानुसार उपविभाग',foot:'© 2026 शिक्षा बचाओ संगठन',soon:'माहिती लवकरच उपलब्ध होईल',official:'अधिकृत स्रोत',links:[['शालेय शिक्षण व क्रीडा विभाग','महाराष्ट्र शालेय शिक्षण विभागाची अधिकृत वेबसाइट','https://education.maharashtra.gov.in/','शिक्षण विभागाची वेबसाइट उघडा'],['MSCERT महाराष्ट्र — शासन निर्णय','MSCERT महाराष्ट्राचे शासन निर्णय','https://maa.ac.in/english/index.php?tcf=shasan_nirnay','MSCERT शासन निर्णय उघडा'],['महाराष्ट्र शासनाचे GR पोर्टल','विभागनिहाय शासन निर्णय शोधण्यासाठी अधिकृत पोर्टल','https://gr.maharashtra.gov.in/1145/Government-Resolutions','अधिकृत GR पोर्टल उघडा']]}};
function setLang(lang){const d=data[lang];['title','subtitle','home','schemes','welfare','downloads','about','notice','heading','foot'].forEach(id=>document.getElementById(id).textContent=d[id]);document.getElementById('cards').innerHTML=d.links.map(x=>`<section class="card"><h2>${x[0]}</h2><p>${x[1]}</p><a href="${x[2]}" target="_blank" rel="noopener">${x[3]}</a></section>`).join('')+`<section class="card"><h2>${d.official}</h2><p>${d.soon}</p></section>`}setLang('hi');</script>
<script id="sba-language-controller">
(function(){
function setSbaLang(lang){
 if(!['hi','en','mr'].includes(lang)) lang='hi';
 document.body.classList.remove('sba-hi','sba-en','sba-mr');
 document.body.classList.add('sba-'+lang);
 document.documentElement.lang=lang;
 document.querySelectorAll('[data-lang]').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-lang')===lang)});
 var banner=document.getElementById('sbaFinalBanner');
 if(banner) banner.style.backgroundImage="url('"+(lang==='en'?'banner-english.png':lang==='mr'?'banner-marathi.png':'banner-hindi.png')+"')";
 try{localStorage.setItem('sba-language',lang)}catch(e){}
}
window.setSbaLang=setSbaLang;
document.addEventListener('DOMContentLoaded',function(){
 document.querySelectorAll('[data-lang]').forEach(function(b){b.addEventListener('click',function(){setSbaLang(b.getAttribute('data-lang'))})});
 var q=new URLSearchParams(location.search).get('lang');
 var saved='hi'; try{saved=localStorage.getItem('sba-language')||'hi'}catch(e){}
 setSbaLang(['hi','en','mr'].includes(q)?q:saved);
});
})();
</script></body></html>
